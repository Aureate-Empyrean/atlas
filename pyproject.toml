[project]
name = "atlas"
version = "0.5.0"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
